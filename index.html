<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis 8 años - Britany Helen</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}

body{
  font-family:'Fredoka', sans-serif;
  color:white;
  overflow-x:hidden;
}

/* BOTÓN MÚSICA */
.music-btn{
  position:fixed;
  right:18px;
  bottom:18px;
  width:58px;
  height:58px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#ff72b6,#7a55d8);
  color:white;
  font-size:26px;
  box-shadow:0 8px 25px rgba(0,0,0,.30);
  z-index:1000;
}

/* PORTADA SIN CUADRO */
.portada{
  min-height:100vh;
  background:url("imagen1.png");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}

.hero{
  max-width:450px;
  padding:20px;
  background:transparent;
}

/* TEXTO PORTADA */
.hero h1,
.hero h2,
.hero p{
  text-shadow:0 3px 12px rgba(0,0,0,.7);
}

.hero h1{
  font-family:'Pacifico';
  font-size:50px;
}

.hero .edad{
  font-size:100px;
  color:#ff72b6;
  text-shadow:0 5px 18px rgba(0,0,0,.8);
}

.hero h2{
  font-size:24px;
}

.hero p{
  margin-top:10px;
  font-size:18px;
}

.btn{
  display:inline-block;
  margin-top:20px;
  padding:14px 25px;
  border-radius:30px;
  text-decoration:none;
  background:linear-gradient(90deg,#ff72b6,#7a55d8);
  color:white;
  font-weight:bold;
}

/* SECCION 2 BLUR */
.seccion-info{
  min-height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}

.seccion-info::before{
  content:"";
  position:absolute;
  inset:0;
  background:url("imagen2.png");
  background-size:cover;
  background-position:center;
  filter:blur(6px);
  transform:scale(1.1);
  z-index:-2;
}

.seccion-info::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.5);
  z-index:-1;
}

.card{
  background:white;
  color:#4a3478;
  padding:20px;
  border-radius:20px;
  max-width:420px;
  width:100%;
  margin-bottom:15px;
  text-align:center;
}

.dato{
  margin:10px 0;
}

/* COUNTDOWN */
.countdown{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.time{
  background:#fff;
  padding:10px;
  border-radius:10px;
}

.time strong{
  display:block;
  color:#ff72b6;
}

/* FINAL */
.final{
  min-height:100vh;
  background:url("imagen3.png");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.final-box{
  background:rgba(255,255,255,.7);
  color:#4a3478;
  padding:25px;
  border-radius:25px;
}

/* BOTONES */
.btn2{
  display:block;
  margin-top:10px;
  padding:15px;
  border-radius:25px;
  text-decoration:none;
  color:white;
  background:linear-gradient(90deg,#ff72b6,#7a55d8);
}

</style>
</head>

<body>

<!-- MUSICA -->
<audio id="music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<button class="music-btn" onclick="toggleMusic()">♪</button>

<!-- PORTADA -->
<section class="portada">
  <div class="hero">
    <h1>Mis</h1>
    <div class="edad">8</div>
    <h1>años</h1>
    <h2>Britany Helen Barconte</h2>
    <p>Una aventura mágica te espera 🦄✨</p>
    <a href="#info" class="btn">Ver invitación</a>
  </div>
</section>

<!-- INFO -->
<section class="seccion-info" id="info">

  <div class="card">
    <h2>Datos del evento</h2>
    <div class="dato">📅 2 de Mayo</div>
    <div class="dato">⏰ 15:30 hs</div>
    <div class="dato">📍 Avenida Jujuy - Susques</div>
  </div>

  <div class="card">
    <h2>Cuenta regresiva</h2>
    <div class="countdown">
      <div class="time"><strong id="d">00</strong>Días</div>
      <div class="time"><strong id="h">00</strong>Hs</div>
      <div class="time"><strong id="m">00</strong>Min</div>
      <div class="time"><strong id="s">00</strong>Seg</div>
    </div>
  </div>

  <a class="btn2" href="https://wa.me/5493887410344?text=Hola confirmo asistencia al cumple de Britany Helen Barconte 🦄✨">
    Confirmar por WhatsApp
  </a>

</section>

<!-- FINAL -->
<section class="final">
  <div class="final-box">
    <h2>¡Te esperamos!</h2>
    <p>Será una tarde mágica 🦄💖</p>
  </div>
</section>

<script>
const target=new Date("2026-05-02T15:30:00").getTime();

setInterval(()=>{
let now=new Date().getTime();
let diff=target-now;

let d=Math.floor(diff/(1000*60*60*24));
let h=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
let m=Math.floor((diff%(1000*60*60))/(1000*60));
let s=Math.floor((diff%(1000*60))/1000);

document.getElementById("d").innerText=d;
document.getElementById("h").innerText=h;
document.getElementById("m").innerText=m;
document.getElementById("s").innerText=s;

},1000);

function toggleMusic(){
let music=document.getElementById("music");
if(music.paused){music.play();}
else{music.pause();}
}
</script>

</body>
</html>
