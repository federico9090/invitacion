<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis 8 años - Britany Helen</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Fredoka', sans-serif;
  color:#4a3478;
  overflow-x:hidden;
}

/* BOTÓN MÚSICA */
.music-btn{
  position:fixed;
  right:18px;
  bottom:18px;
  width:58px;
  height:58px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#ff72b6,#7a55d8);
  color:white;
  font-size:26px;
  font-weight:bold;
  box-shadow:0 8px 25px rgba(0,0,0,.30);
  z-index:1000;
  cursor:pointer;
}

/* ========================= */
/* PORTADA - IMAGEN 1 (SIN BLUR) */
/* ========================= */
.portada{
  min-height:100vh;
  background:url("imagen1.png");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}

.hero{
  width:100%;
  max-width:450px;
  padding:25px 18px;
  border-radius:30px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(8px);
  box-shadow:0 15px 40px rgba(0,0,0,.20);
}

.hero h1{
  font-family:'Pacifico', cursive;
  font-size:48px;
  color:#7a55d8;
  text-shadow:0 3px 0 white;
}

.hero .edad{
  font-size:95px;
  line-height:1;
  font-weight:700;
  color:#ff72b6;
  text-shadow:0 5px 0 white;
}

.hero h2{
  font-size:24px;
  margin-top:10px;
}

.hero p{
  margin-top:12px;
  font-size:18px;
  font-weight:600;
}

/* ========================= */
/* SECCIÓN 2 - IMAGEN 2 (CON BLUR) */
/* ========================= */
.seccion-info{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  padding:50px 20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* BLUR SOLO AQUÍ */
.seccion-info::before{
  content:"";
  position:absolute;
  inset:0;
  background:url("imagen2.png");
  background-size:cover;
  background-position:center;
  filter:blur(6px);
  transform:scale(1.1);
  z-index:-2;
}

/* CAPA CLARA */
.seccion-info::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.45);
  z-index:-1;
}

.card{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,.85);
  border-radius:28px;
  padding:24px 20px;
  box-shadow:0 12px 35px rgba(0,0,0,.18);
  text-align:center;
  margin-bottom:18px;
}

.card h2{
  font-size:28px;
  color:#7a55d8;
  margin-bottom:18px;
}

.dato{
  background:white;
  border-radius:18px;
  padding:14px;
  margin:12px 0;
  font-size:18px;
  font-weight:600;
}

.btn{
  display:block;
  width:100%;
  max-width:430px;
  margin:12px auto;
  padding:16px;
  border-radius:30px;
  text-decoration:none;
  color:white;
  font-size:18px;
  font-weight:700;
  text-align:center;
  background:linear-gradient(90deg,#ff72b6,#7a55d8);
}

.btn.mapa{
  background:linear-gradient(90deg,#55d6ff,#7a55d8);
}

/* ========================= */
/* CUENTA REGRESIVA */
/* ========================= */
.countdown{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.time{
  background:white;
  border-radius:16px;
  padding:12px;
}

.time strong{
  display:block;
  font-size:24px;
  color:#ff72b6;
}

/* ========================= */
/* FINAL - IMAGEN 3 (SIN BLUR) */
/* ========================= */
.final{
  min-height:100vh;
  background:url("imagen3.png");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}

.final-box{
  background:rgba(255,255,255,.75);
  border-radius:30px;
  padding:30px;
}

.final-box h2{
  font-family:'Pacifico';
  font-size:40px;
}

/* ========================= */
</style>
</head>

<body>

<!-- MÚSICA (USAR MP3 DIRECTO) -->
<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" onclick="toggleMusic()">♪</button>

<!-- PORTADA -->
<section class="portada">
  <div class="hero">
    <h1>Mis</h1>
    <div class="edad">8</div>
    <h1>años</h1>
    <h2>Britany Helen Barconte</h2>
    <p>Una aventura mágica te espera 🦄✨</p>
    <a class="btn" href="#info">Ver invitación</a>
  </div>
</section>

<!-- INFO -->
<section class="seccion-info" id="info">

  <div class="card">
    <h2>Datos del evento</h2>
    <div class="dato">📅 2 de Mayo</div>
    <div class="dato">⏰ 15:30 hs</div>
    <div class="dato">📍 Avenida Jujuy - Susques</div>
  </div>

  <div class="card">
    <h2>Cuenta regresiva</h2>
    <div class="countdown">
      <div class="time"><strong id="d">00</strong>Días</div>
      <div class="time"><strong id="h">00</strong>Hs</div>
      <div class="time"><strong id="m">00</strong>Min</div>
      <div class="time"><strong id="s">00</strong>Seg</div>
    </div>
  </div>

  <a class="btn" href="https://wa.me/5493887410344?text=Hola confirmo asistencia al cumple de Britany Helen Barconte 🦄✨">
    Confirmar por WhatsApp
  </a>

</section>

<!-- FINAL -->
<section class="final">
  <div class="final-box">
    <h2>¡Te esperamos!</h2>
    <p>Será una tarde mágica 🦄💖</p>
  </div>
</section>

<script>
const target=new Date("2026-05-02T15:30:00").getTime();

setInterval(()=>{
let now=new Date().getTime();
let diff=target-now;

let d=Math.floor(diff/(1000*60*60*24));
let h=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
let m=Math.floor((diff%(1000*60*60))/(1000*60));
let s=Math.floor((diff%(1000*60))/1000);

document.getElementById("d").innerText=d;
document.getElementById("h").innerText=h;
document.getElementById("m").innerText=m;
document.getElementById("s").innerText=s;

},1000);

function toggleMusic(){
  let music=document.getElementById("music");
  if(music.paused){music.play();}
  else{music.pause();}
}
</script>

</body>
</html>
